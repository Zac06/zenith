[package]
name = "zenith"
version = "0.2.1"
edition = "2021"

[lib]
name = "zenith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
md5 = "0.7"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-dialog = "2.8.0"

# Desktop only: a second launch hands its deep link to the running window.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Android has no keyring backend (the session goes to the app's private storage instead), see `secret` in lib.rs.
[target.'cfg(not(target_os = "android"))'.dependencies]
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
reqwest = { version = "0.12", features = ["json"] }

# Android: the system's OpenSSL isn't available to cross-compile against, so use rustls (bundled root certificates).
[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# opening a file in another app, and keeping the login in the Android Keystore (see MOBILE.md)
tauri-plugin-android-native = { path = "plugins/android-native" }

# iOS: previewing a file in the system viewer (Quick Look)
[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-ios-native = { path = "plugins/ios-native" }
