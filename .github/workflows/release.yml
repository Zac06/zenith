name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            args: ""
          - os: windows-latest
            args: ""
          - os: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - name: Tag matches the app version
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          for f in package.json src-tauri/tauri.conf.json; do grep -q "\"version\": \"$v\"" "$f" || { echo "$f is not version $v"; exit 1; }; done
          grep -q "^version = \"$v\"" src-tauri/Cargo.toml || { echo "Cargo.toml is not version $v"; exit 1; }
      - name: Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Zenith ${{ github.ref_name }}"
          releaseDraft: true
          includeUpdaterJson: true
          updaterJsonKeepUniversal: true
          args: ${{ matrix.args }}

  android:
    # the desktop job above creates the draft release; this one adds the signed APK to it
    needs: build
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with: { workspaces: "src-tauri -> target" }
      - uses: android-actions/setup-android@v3
        with: { packages: "ndk;28.2.13676358" }   # the platform for compileSdk is downloaded by Gradle, which knows its exact package name
      - run: echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Set up Android signing
        env:
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
        run: |
          [ -n "$KEY_BASE64" ] || { echo "::error::Add the ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD and ANDROID_KEY_BASE64 secrets (see MOBILE.md)"; exit 1; }
          echo "$KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          {
            echo "keyAlias=$KEY_ALIAS"
            echo "password=$KEY_PASSWORD"
            echo "storeFile=$RUNNER_TEMP/keystore.jks"
          } > src-tauri/gen/android/keystore.properties
      - run: npm run tauri android build -- --apk --target aarch64 --target armv7
      - name: Name the APK
        run: cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "Zenith_${{ github.ref_name }}.apk"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: Zenith_${{ github.ref_name }}.apk

  checksums:
    # last job, so it hashes the desktop and Android assets together
    needs: [build, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Hash the release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir dist
          gh release download "$GITHUB_REF_NAME" --dir dist
          rm -f dist/SHA256SUMS
          (cd dist && sha256sum * > ../SHA256SUMS)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: SHA256SUMS
